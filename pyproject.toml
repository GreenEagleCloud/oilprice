[project]
name = "oilprice-prediction-for-switzerland"
version = "0.1.0"
description = "Python environment for the oilprice prediction app"
authors = [{ name = "gerald eggenberger" }]
requires-python = ">=3.12"
dependencies = [
    # --- Core data & ML libraries (imported directly by the exercise notebooks) ---
    "pandas",          # dataframes / data manipulation (07, 12, 14, 16, 19)
    "numpy",           # numerical arrays (12)
    "scikit-learn",    # model training & evaluation (07, 10, 14)
    "matplotlib",      # plotting (07)
    "requests",        # HTTP calls to the model registry (07)
    "pyarrow",         # Parquet read/write engine used by pandas (07, 12, 14, 19)
    # --- Object storage (Rook-Ceph / S3) ---
    "s3fs>=2025.0",    # S3 filesystem access (06, 07, 09, 12, 14, 19); >=2025 for S3FileSystem(key=, secret=, endpoint_url=)
    "boto3",
    # --- MLflow: experiment tracking & model registry ---
    "mlflow",          # tracking, autolog, model registry (10, 12, 16)
    "flask",           # required by mlflow when validating model signatures
    # --- Stream processing (Kafka / Quix) ---
    "kafka-python-ng", # `kafka` producer/consumer client (14)
    "quixstreams",     # stream processing framework (16, 19)
    # --- Observability & data quality ---
    "loguru",          # structured logging (14, 19)
    "statsd",          # metrics client (19)
    "evidently",       # data drift / quality reports (19)
    # --- Notebook runtime ---
    "jupyter",         # run the exercise notebooks
    "ipykernel>=7.3.0",
    "stack-data>=0.6.3",
    "hopsworks[python]>=5.1,<5.2",
    "python-dotenv>=1.2.4",
]
