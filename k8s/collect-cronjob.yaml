apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-daily-prices
  namespace: oilprice
spec:
  # Twice a day - 13:30 and 23:30 UTC - both before the feature pipeline (00:00)
  # and the training pipeline (01:00).
  #
  # heizoel24 publishes the price of the current day during CEST daytime (seen
  # on 2026-10-28 already at 12:43 UTC, on 2026-10-29 at 08:09 UTC), but the
  # feed already carries a row for the next day with an empty price. A single
  # run at 23:30 UTC (= 01:30 CEST) therefore always stored the day that had
  # just ended, and the frontend showed yesterday for the whole of today.
  #
  # The 13:30 UTC run (15:30 CEST) publishes the current day while the day is
  # still running; the 23:30 UTC run re-reads the same 3-month window and
  # overwrites the intraday value with the final one, because merge() lets the
  # freshly fetched row win on overlapping dates. Both runs are idempotent.
  schedule: "30 13,23 * * *"
  # Two overlapping collectors would both read, merge and write
  # s3://oilprice-features/raw/oil_data.csv.
  concurrencyPolicy: Forbid
  # Emit an event if the job cannot start within 30 min of its scheduled time
  # (image pull problems, node pressure) instead of skipping the run silently.
  startingDeadlineSeconds: 1800
  # The default failedJobsHistoryLimit is 1. During the 2026-10-25..27 outage the
  # failed Jobs of the two earlier nights had already been replaced, so a
  # three-day outage looked like one bad night and was undiagnosable. Keep
  # enough failed history to see the pattern.
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # bounds a stuck upstream request (Yahoo/ECB/FRED) - the collector itself
      # has no hard timeout because yfinance must run in the main thread
      activeDeadlineSeconds: 1800
      # Both collector scripts now retry their upstreams internally (heizoel24,
      # Yahoo, ECB, FRED), so a transient outage is handled inside the run. A pod
      # that still fails is broken for a reason the kubelet backoff (10s, 20s,
      # 40s ...) will not fix: on 2026-10-27 the default limit burned 7 pods in
      # 5m43s and produced seven S3 reads and no write. Fail fast and visibly.
      backoffLimit: 2
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
          containers:
          - name: collect-daily-prices
            image: ghcr.io/greeneaglecloud/oilprice-pipelines:2.7
            imagePullPolicy: Always
            # Prices (heizoel24) and market data (Yahoo/ECB/FRED) are independent
            # feeds. With `&&` a market failure re-ran the whole container, price
            # fetch included; now each step runs exactly once and the Job fails if
            # either step fails.
            command:
            - sh
            - -c
            - |
              rc=0
              python src/collect_daily_prices.py || rc=1
              python src/collect_oil_market_prices.py || rc=1
              exit $rc
            # Without requests the pod has no QoS class (BestEffort), which makes
            # it the first eviction candidate under node pressure. yfinance +
            # pandas need a few hundred MB; the limit is generous enough for the
            # ECB history zip.
            resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                cpu: "1"
                memory: "2Gi"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            env:
            # unbuffered stdout so `kubectl logs` shows progress immediately
            - name: PYTHONUNBUFFERED
              value: "1"
            # S3 (rook-ceph object storage): raw price data upload
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_secret_access_key
            - name: AWS_ENDPOINT_URL
              value: http://rook-ceph-rgw-objectstore.rook-ceph.svc:8080
          restartPolicy: OnFailure