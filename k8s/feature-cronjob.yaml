apiVersion: batch/v1
kind: CronJob
metadata:
  name: feature-pipeline
  namespace: oilprice
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
          containers:
          - name: feature-pipeline
            image: ghcr.io/greeneaglecloud/oilprice-pipelines:1.0
            command: ["python", "src/hw_feature_pipeline.py"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            env:
            # Hopsworks (Feature Store upsert)
            - name: HOPSWORKS_HOST
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_HOST
            - name: HOPSWORKS_PORT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PORT
            - name: HOPSWORKS_PROJECT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PROJECT
            - name: HOPSWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_API_KEY
            - name: HOPSWORKS_ENGINE
              value: "python"
          restartPolicy: OnFailure