apiVersion: batch/v1
kind: CronJob
metadata:
  name: feature-pipeline
  namespace: oilprice
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      # hard bound: a stuck S3/Hopsworks request must not run into the next cron
      activeDeadlineSeconds: 3600
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
          containers:
          - name: feature-pipeline
            image: ghcr.io/greeneaglecloud/oilprice-pipelines:2.8
            imagePullPolicy: Always
            # Order matters: the Rhine and market pipelines write the driver
            # feature groups AND their local feature CSVs, and the weekly /
            # forward pipelines join those CSVs into their own feature groups.
            command: ["sh", "-c", "python src/hw_rhein_feature_pipeline.py && python src/hw_oil_market_feature_pipeline.py && python src/hw_feature_pipeline.py && python src/hw_forward_feature_pipeline.py"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            env:
            # unbuffered stdout so `kubectl logs` shows progress immediately
            - name: PYTHONUNBUFFERED
              value: "1"
            # Hopsworks (Feature Store upsert)
            - name: HOPSWORKS_HOST
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_HOST
            - name: HOPSWORKS_PORT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PORT
            - name: HOPSWORKS_PROJECT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PROJECT
            - name: HOPSWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_API_KEY
            - name: HOPSWORKS_ENGINE
              value: "python"
            # S3 (rook-ceph): fresh raw prices written by collect-daily-prices
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_secret_access_key
            - name: AWS_ENDPOINT_URL
              value: http://rook-ceph-rgw-objectstore.rook-ceph.svc:8080
          restartPolicy: OnFailure