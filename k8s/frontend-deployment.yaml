apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: oilprice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
      containers:
      - name: frontend
        image: ghcr.io/greeneaglecloud/oilprice-frontend:1.0
        ports:
        - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: BACKEND_URL
          value: "http://inference-service:5000/predict"