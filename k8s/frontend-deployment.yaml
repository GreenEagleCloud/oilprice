apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: oilprice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
      containers:
      - name: frontend
        image: ghcr.io/greeneaglecloud/oilprice-frontend:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: BACKEND_URL
          value: "http://inference-service:5000/predict"
        # read the fresh raw price CSV from S3 (written daily by the
        # collect-daily-prices CronJob); falls back to the bundled CSV
        # (see Dockerfile.frontend) when S3 is not reachable
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: aws_secret_access_key
        - name: AWS_ENDPOINT_URL
          value: "http://rook-ceph-rgw-objectstore.rook-ceph.svc:8080"