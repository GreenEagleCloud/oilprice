apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oilprice
  namespace: coder
  labels:
    app.kubernetes.io/name: oilprice
spec:
  hostnames:
  - "oilprice.greeneagle.ai"
  parentRefs:
  - name: coder
    namespace: coder
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-service
      namespace: oilprice
      port: 5000