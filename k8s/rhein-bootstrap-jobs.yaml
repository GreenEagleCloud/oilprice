# ---------------------------------------------------------------------------
# One-off Rhine bootstrap jobs (same image/env as k8s/collect-rhein-cronjob.yaml)
#
#   levels: full data.bs.ch history since 2020  -> raw/rhein_levels.csv + snapshot
#   cargo : re-parse every cargo bulletin PDF   -> raw/rhein_cargo.csv
#
#   kubectl -n oilprice apply -f /tmp/pegel/rhein-bootstrap-jobs.yaml
#   kubectl -n oilprice get jobs -l purpose=rhein-bootstrap -w
#   kubectl -n oilprice logs -f job/rhein-levels-bootstrap
#   kubectl -n oilprice logs -f job/rhein-cargo-bootstrap
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: rhein-levels-bootstrap
  namespace: oilprice
  labels:
    app: oilprice
    purpose: rhein-bootstrap
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: oilprice
        purpose: rhein-bootstrap
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
      containers:
      - name: collect-rhein-levels
        image: ghcr.io/greeneaglecloud/oilprice-pipelines:2.6
        imagePullPolicy: Always
        command: ["python", "src/collect_rhein_levels.py", "--bootstrap"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: aws_secret_access_key
        - name: AWS_ENDPOINT_URL
          value: http://rook-ceph-rgw-objectstore.rook-ceph.svc:8080
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhein-cargo-bootstrap
  namespace: oilprice
  labels:
    app: oilprice
    purpose: rhein-bootstrap
spec:
