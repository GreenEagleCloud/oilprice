apiVersion: batch/v1
kind: CronJob
metadata:
  name: training-pipeline
  namespace: oilprice
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
          containers:
          - name: training-pipeline
            image: ghcr.io/greeneaglecloud/oilprice-pipelines:1.6
            imagePullPolicy: Always
            command: ["sh", "-c", "python src/hw_training_pipeline.py && python src/hw_forward_training_pipeline.py"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            env:
            # Hopsworks (feature view + Model Registry)
            - name: HOPSWORKS_HOST
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_HOST
            - name: HOPSWORKS_PORT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PORT
            - name: HOPSWORKS_PROJECT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PROJECT
            - name: HOPSWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_API_KEY
            - name: HOPSWORKS_ENGINE
              value: "python"
            # MLflow experiment tracking
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: tracking_uri
            # S3 export of the model (rook-ceph object storage)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_secret_access_key
            - name: AWS_ENDPOINT_URL
              value: http://rook-ceph-rgw-objectstore.rook-ceph.svc:8080
          restartPolicy: OnFailure