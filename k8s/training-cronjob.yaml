apiVersion: batch/v1
kind: CronJob
metadata:
  name: training-pipeline
  namespace: oilprice
spec:
  schedule: "0 1 * * *"
  # A retrain must never overlap the previous one: two concurrent jobs would both
  # try to register a model version and both write s3://oilprice-models/.
  concurrencyPolicy: Forbid
  # Alert if the job cannot start within 30 min of its scheduled time (image pull
  # problems, node pressure) instead of silently skipping the run.
  startingDeadlineSeconds: 1800
  # Keep the failed runs: a blocked promotion gate is a signal, not noise.
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # hard bound: a stuck Hopsworks login/upsert must not run into the next cron
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-credentials-e8207fde-aef2-4adb-81c6-5e3e678d44b6
          containers:
          - name: training-pipeline
            image: ghcr.io/greeneaglecloud/oilprice-pipelines:2.6
            imagePullPolicy: Always
            # Exit code 2 means "promotion gate blocked the artifact", which is a
            # policy outcome, not a crash: the forward model must still train and
            # the CronJob must not report a failure. Any other non-zero code is a
            # real error and must surface as a failed Job.
            command: ["sh", "-c", "python src/hw_training_pipeline.py; weekly=$?; python src/hw_forward_training_pipeline.py; forward=$?; echo \"weekly_exit=$weekly forward_exit=$forward\"; if [ $weekly -ne 0 ] && [ $weekly -ne 2 ]; then exit 1; fi; if [ $forward -ne 0 ] && [ $forward -ne 2 ]; then exit 1; fi; exit 0"]
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "2"
                memory: "3Gi"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            env:
            # unbuffered stdout so `kubectl logs` shows progress immediately
            - name: PYTHONUNBUFFERED
              value: "1"
            # Hopsworks (feature view + Model Registry)
            - name: HOPSWORKS_HOST
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_HOST
            - name: HOPSWORKS_PORT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PORT
            - name: HOPSWORKS_PROJECT
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_PROJECT
            - name: HOPSWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hopsworks-credentials
                  key: HOPSWORKS_API_KEY
            - name: HOPSWORKS_ENGINE
              value: "python"
            # MLflow experiment tracking
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: tracking_uri
            # S3 export of the model (rook-ceph object storage). src/s3_credentials.py
            # reads exactly these three variables - the pipeline never calls kubectl,
            # so the Job pod needs no kubeconfig and no RBAC on rook-ceph Secrets.
            # (S3_ENDPOINT_URL is accepted as an alias of AWS_ENDPOINT_URL.)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws_secret_access_key
            - name: AWS_ENDPOINT_URL
              value: http://rook-ceph-rgw-objectstore.rook-ceph.svc:8080
          restartPolicy: OnFailure